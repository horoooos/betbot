name: Check STAVKA TV access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pandas scipy numpy
      - name: Inspect public tennis market coverage
        continue-on-error: true
        run: python tools/stavka_market_probe.py
      - name: Verify real parsing and match alignment without publishing
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
        run: python tools/stavka_check.py
