name: Find match broadcasts
on:
  workflow_dispatch:
    inputs:
      probe:
        type: boolean
        default: false
        description: Diagnose public YouTube listing format
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: broadcast-search
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pandas google-auth
      - name: Discover event-specific public broadcasts
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          PROBE: ${{ inputs.probe }}
        run: python tools/broadcast_scan.py --remote --publish $([ "$PROBE" = true ] && echo --probe-youtube || true)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broadcast-search-report
          path: work/broadcasts-check.json
