name: Refresh Dzen match cover
on:
  workflow_dispatch:
    inputs:
      source_id:
        description: Source match-start message ID
        required: true
      target_id:
        description: Existing mirror message ID
        required: true
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow pandas
      - name: Replace verified match image
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE_ID: ${{ inputs.source_id }}
          TARGET_ID: ${{ inputs.target_id }}
        run: python tools/refresh_dzen_cover.py
