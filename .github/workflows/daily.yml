name: BetBot

# Бот работает по кругу и не зависит от расписания GitHub: одна задача крутится ~5.5 часа,
# запуская бота каждые LOOP_MINUTES минут, а в конце сама запускает следующую.
# Расписание ниже — только страховка, если цепочка вдруг оборвётся.
# Остановить бота: Actions → BetBot → «…» → Disable workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"   # страховка: если цепочка оборвалась, бот поднимется не позже чем через 30 минут

permissions:
  contents: write
  actions: write

concurrency:
  group: betbot                 # всегда работает только одна копия бота
  cancel-in-progress: false

env:
  LOOP_MINUTES: "2"            # как часто бот проверяет матчи (live-голы — с задержкой до 2 минут)
  LOOP_HOURS: "5.5"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - id: day
        run: echo "day=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache of match history
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ steps.day.outputs.day }}-${{ github.run_id }}
          restore-keys: raw-
      - run: pip install -r requirements.txt
      - name: Bot loop
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
        run: |
          git config user.name "betbot"
          git config user.email "betbot@users.noreply.github.com"
          export GIT_TERMINAL_PROMPT=0   # git никогда не ждёт ввода — иначе цикл может встать навсегда
          end=$(( $(date +%s) + $(python -c "print(int(float('$LOOP_HOURS') * 3600))") ))
          # пуши бота через github.token не запускают другие workflow — сборку сайта запускаем сами (не чаще раза в 2,5 минуты)
          pages_sha=""; pages_at=0
          while [ "$(date +%s)" -lt "$end" ]; do
            started=$(date +%s)
            # жёсткий лимит на один проход: если какой-то сервис «повесит» запрос, цикл не встанет на часы
            timeout 900 python -W ignore run.py || echo "::warning::запуск бота завершился с ошибкой или превысил 15 минут"
            for f in data/state.json data/matches.json data/other.json data/live.json data/results.csv data/value_bets.csv data/names_ru.json data/channel.json data/match_events.json data/teamids.json docs; do
              if [ -e "$f" ]; then git add "$f"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -q -m "Bot update $(TZ=Europe/Moscow date '+%F %H:%M')"
              # сохраняем надёжно: до 3 попыток; при неудаче — откат незаконченного rebase, чтобы следующий проход начал с чистого места
              ok=""
              for try in 1 2 3; do
                if timeout 600 git pull -q --rebase -X theirs && timeout 180 git push -q; then ok=1; break; fi
                git rebase --abort 2>/dev/null || true
                echo "::warning::сохранение не удалось (попытка $try): $(git status -sb | head -1)"
                sleep 5
              done
              [ -n "$ok" ] || echo "::warning::не удалось сохранить состояние — попробуем на следующем проходе"
            else
              # сохранять нечего (например, проход упал) — всё равно подтягиваем свежий код с исправлениями
              timeout 600 git pull -q --rebase -X theirs || git rebase --abort 2>/dev/null || true
            fi
            if [ $(( $(date +%s) - pages_at )) -ge 150 ] && { [ -z "$pages_sha" ] || ! git diff --quiet "$pages_sha" HEAD -- docs; }; then
              timeout 60 gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main && pages_sha=$(git rev-parse HEAD) && pages_at=$(date +%s) || echo "::warning::сборка сайта не запустилась"
            fi
            wait=$(( LOOP_MINUTES * 60 - ($(date +%s) - started) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done
      - name: Start next loop
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --repo "${{ github.repository }}" --ref main
