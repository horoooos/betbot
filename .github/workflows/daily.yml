name: BetBot

on:
  schedule:
    - cron: "*/20 8-23 * * *"   # каждые 20 минут с 11:00 до 03:00 МСК — когда идут почти все матчи
    - cron: "10 0-7 * * *"      # ночью и утром раз в час (в 08:10 МСК выходит расписание)
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: betbot                 # два запуска одновременно не пойдут
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - id: day
        run: echo "day=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_OUTPUT"
      - name: Cache of match history
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ steps.day.outputs.day }}
          restore-keys: raw-
      - run: pip install -r requirements.txt
      - run: python -W ignore run.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save bot state
        if: always()
        run: |
          git config user.name "betbot"
          git config user.email "betbot@users.noreply.github.com"
          for f in data/state.json data/matches.json data/results.csv data/names_ru.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -q -m "Bot update $(TZ=Europe/Moscow date '+%F %H:%M')"
          git pull -q --rebase && git push -q
