name: Daily predictions

on:
  schedule:
    - cron: "0 7 * * *"   # каждый день в 10:00 по Москве
  workflow_dispatch:       # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run_daily.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save history of picks
        run: |
          git config user.name "betbot"
          git config user.email "betbot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily update $(date +%F)"
          git push
