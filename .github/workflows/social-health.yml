name: Verify owned social channels
on:
  workflow_dispatch:
    inputs:
      update_news_buttons:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow pandas numpy scipy
      - name: Verify bot access and optional news navigation
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPLY_BUTTONS: ${{ inputs.update_news_buttons }}
        run: |
          python -u - <<'PY'
          import os,json
          from pathlib import Path
          from betbot import telegram,dzen,promotion
          me=telegram._call('getMe',chat_id=None)
          report={'bot':me['username'],'targets':[]}
          for target in [os.environ['TELEGRAM_CHAT_ID'],dzen.TARGET]:
              try:
                  chat=telegram._call('getChat',chat_id=target)
                  member=telegram._call('getChatMember',chat_id=target,user_id=me['id'])
                  report['targets'].append({'username':chat.get('username'),'role':member.get('status'),'can_post':member.get('can_post_messages')})
              except Exception as e:report['targets'].append({'error':type(e).__name__})
          if os.environ.get('APPLY_BUTTONS')=='true':
              posts=json.loads(Path('data/channel.json').read_text(encoding='utf-8'))['posts']
              pid=max(int(k) for k,p in posts.items() if dzen.delivery_kind(p.get('html',''))=='новость' and not p.get('reply'))
              report['main_news_buttons']=promotion.attach_news_links(pid)
              report['main_news_url']='https://t.me/aistavvit/'+str(pid)
              state=json.loads(Path('data/state.json').read_text(encoding='utf-8'));last=state.get('dz_last_delivery') or {}
              if last.get('kind')=='новость' and last.get('message_id'):
                  try:
                      telegram._call('editMessageReplyMarkup',chat_id=dzen.TARGET,message_id=last['message_id'],reply_markup=promotion.news_keyboard(last.get('source_id')))
                      report['mirror_news_buttons']=True
                  except Exception as e:report['mirror_news_buttons_error']=type(e).__name__
          out=Path('work/social-health.json');out.parent.mkdir(exist_ok=True);out.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: social-health
          path: work/social-health.json
