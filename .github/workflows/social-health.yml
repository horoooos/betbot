name: Verify owned social channels
on:
  workflow_dispatch:
    inputs:
      clear_dzen_buttons:
        type: boolean
        default: false
        description: Remove only inline buttons from the latest 50 mirror posts
      send_dzen_probe:
        type: boolean
        default: false
        description: Send one clearly marked news-format probe to the owned mirror
      update_news_buttons:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow pandas numpy scipy
      - name: Verify bot access and optional news navigation
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPLY_BUTTONS: ${{ inputs.update_news_buttons }}
          SEND_DZEN_PROBE: ${{ inputs.send_dzen_probe }}
          CLEAR_DZEN_BUTTONS: ${{ inputs.clear_dzen_buttons }}
        run: |
          python -u - <<'PY'
          import os,json
          from pathlib import Path
          from betbot import telegram,dzen,promotion
          me=telegram._call('getMe',chat_id=None)
          report={'bot':me['username'],'targets':[]}
          for target in [os.environ['TELEGRAM_CHAT_ID'],dzen.TARGET]:
              try:
                  chat=telegram._call('getChat',chat_id=target)
                  member=telegram._call('getChatMember',chat_id=target,user_id=me['id'])
                  report['targets'].append({'username':chat.get('username'),'role':member.get('status'),'can_post':member.get('can_post_messages')})
              except Exception as e:report['targets'].append({'error':type(e).__name__})
          try:
              admins=telegram._call('getChatAdministrators',chat_id=dzen.TARGET,return_bots=True)
              bots=[a for a in admins if a.get('user',{}).get('is_bot')]
              sync=next((a for a in bots if a.get('user',{}).get('username','').lower()=='zen_sync_bot'),None)
              report['dzen_sync']={'checked_with_return_bots':True,'present':bool(sync),'role':sync.get('status') if sync else None}
              report['dzen_sync']['bot_admin_usernames']=[a.get('user',{}).get('username') for a in bots]
              state=json.loads(Path('data/state.json').read_text(encoding='utf-8'))
              report['mirror_delivery']={k:state.get(k) for k in ['dz_last','dz_err','dz_last_delivery']}
          except Exception as exc:report['dzen_sync']={'error':type(exc).__name__}
          if os.environ.get('APPLY_BUTTONS')=='true':
              posts=json.loads(Path('data/channel.json').read_text(encoding='utf-8'))['posts']
              pid=max(int(k) for k,p in posts.items() if dzen.delivery_kind(p.get('html',''))=='новость' and not p.get('reply'))
              report['main_news_buttons']=promotion.attach_news_links(pid)
              report['main_news_url']='https://t.me/aistavvit/'+str(pid)
              state=json.loads(Path('data/state.json').read_text(encoding='utf-8'));last=state.get('dz_last_delivery') or {}
              if last.get('kind')=='новость' and last.get('message_id'):
                  try:
                      telegram._call('editMessageReplyMarkup',chat_id=dzen.TARGET,message_id=last['message_id'],reply_markup=json.dumps({'inline_keyboard':[]}))
                      report['mirror_news_buttons']=True
                  except Exception as e:report['mirror_news_buttons_error']=type(e).__name__
          if os.environ.get('CLEAR_DZEN_BUTTONS')=='true':
              state=json.loads(Path('data/state.json').read_text(encoding='utf-8'));last=state.get('dz_last_delivery') or {}
              newest=int(last.get('message_id') or 0);cleared=[];unchanged=0;errors=0
              for mid in range(max(1,newest-49),newest+1):
                  try:
                      result=telegram._call('editMessageReplyMarkup',chat_id=dzen.TARGET,message_id=mid,reply_markup=json.dumps({'inline_keyboard':[]}))
                      if isinstance(result,dict) and not (result.get('reply_markup') or {}).get('inline_keyboard'):cleared.append(mid)
                  except Exception as exc:
                      if 'message is not modified' in str(exc).lower():unchanged+=1
                      else:errors+=1
              report['dzen_buttons_cleanup']={'cleared':cleared,'already_without_buttons':unchanged,'other_errors':errors,'latest_checked':newest}
          if os.environ.get('SEND_DZEN_PROBE')=='true':
              import requests,io,re
              from PIL import Image
              from betbot import pages,postimg
              posts=json.loads(Path('data/channel.json').read_text(encoding='utf-8'))['posts']
              news=pages._news({int(k):v for k,v in posts.items()})
              n=next(n for n in news if n.get('photo') and n.get('complete',True))
              body=postimg.plain(n['body']).strip().split('\n\n')[0]
              caption='Проверка синхронизации · Дзен\n\n'+n['title']+'\n\n'+body
              if len(caption)>1000:
                  sentences=re.findall(r'.*?[.!?…](?=\s|$)',body,flags=re.S)
                  body=next((v.strip() for v in sentences if len(v)+len(n['title'])<900),'Полная новость доступна в основном канале АИ СТАВИТ.')
                  caption='Проверка синхронизации · Дзен\n\n'+n['title']+'\n\n'+body
              try:
                  response=requests.get(n['photo'],timeout=25)
                  if not response.ok:raise RuntimeError('Source cover unavailable')
                  im=Image.open(io.BytesIO(response.content)).convert('RGB');data=io.BytesIO();im.save(data,'JPEG',quality=92)
              except Exception:raise RuntimeError('Probe image unavailable; source URL hidden') from None
              sent=telegram._call('sendPhoto',chat_id=dzen.TARGET,files={'photo':('news.jpg',data.getvalue(),'image/jpeg')},caption=caption)
              report['dzen_format_probe']={'message_url':'https://t.me/aistavvit_dzen/'+str(sent['message_id']),'source_id':n['id'],'title':n['title'],'has_photo':bool(sent.get('photo')),'buttons':False,'external_links':False}
          out=Path('work/social-health.json');out.parent.mkdir(exist_ok=True);out.write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8');print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: social-health
          path: work/social-health.json
