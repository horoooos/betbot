name: Dota live positions
on:
  workflow_dispatch:
    inputs:
      mode:
        description: One check or continuous free relay
        default: once
        type: choice
        options: [once, loop]
permissions:
  contents: read
  actions: write
concurrency:
  group: dota-live-relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests google-auth
      - name: Relay real coordinates
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          MODE: ${{ inputs.mode }}
        run: python tools/dota_live_relay.py --configure --hours "$([ "$MODE" = loop ] && echo 5.3 || echo 0)"
      - name: Continue relay
        if: success() && inputs.mode == 'loop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run esports-live.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=loop
