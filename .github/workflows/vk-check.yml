name: VK check
# Ручная проверка ключа ВКонтакте: какое сообщество, какие права. Сам ключ в журнал не попадает.
on:
  workflow_dispatch:
    inputs:
      delete_post:
        description: "Номер поста на стене ВК, который удалить (пусто — ничего не удалять)"
        required: false
        default: ""
      test_text:
        description: "Текст тестового поста в ВК (пусто — не публиковать)"
        required: false
        default: ""
      post_now:
        description: "1 — снять паузу и сразу опубликовать свежие посты с фото"
        required: false
        default: ""
      photo_test:
        description: "1 — опубликовать отдельную тестовую запись с фото и проверить вложение"
        required: false
        default: ""
      verify_post_id:
        description: "Номер уже созданной записи: только проверить её вложения, не публикуя и не удаляя"
        required: false
        default: ""
      diagnostics:
        description: "1 — выполнить расширенную диагностику API ВК (несколько запросов)"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check VK token
        if: ${{ inputs.diagnostics == '1' && inputs.photo_test != '1' && inputs.verify_post_id == '' && inputs.post_now != '1' }}
        continue-on-error: true
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request
          tok = os.environ.get("VK_TOKEN", "").strip()
          print("ключ задан:", bool(tok))
          def call(method, **p):
              p.update(access_token=tok, v="5.199")
              data = urllib.parse.urlencode(p).encode()
              with urllib.request.urlopen(f"https://api.vk.com/method/{method}", data, timeout=30) as r:
                  return json.load(r)
          g = call("groups.getById")
          print("groups.getById:", json.dumps(g, ensure_ascii=False)[:600])
          gid = None
          try:
              items = g["response"].get("groups") or g["response"]
              gid = items[0]["id"]
              print("СООБЩЕСТВО:", items[0].get("name"), "| vk.com/" + str(items[0].get("screen_name")), "| id", gid)
          except Exception as e:
              print("не удалось определить сообщество:", e)
          if gid:
              print("photos.getWallUploadServer:", json.dumps(call("photos.getWallUploadServer", group_id=gid), ensure_ascii=False)[:300])
              print("wall.get:", json.dumps(call("wall.get", owner_id=-gid, count=1), ensure_ascii=False)[:300])
              # пустой пост: ВК его не опубликует, но по ошибке видно, есть ли право публиковать (27 — нет, 100 — есть)
              print("wall.post (пустой, проверка прав):", json.dumps(call("wall.post", owner_id=-gid, from_group=1, message=""), ensure_ascii=False)[:300])
              # тест загрузки фото (ничего не публикуется): берём картинку и пробуем разные варианты
              import uuid
              img = urllib.request.urlopen("https://horoooos.github.io/betbot/og.png", timeout=30).read()
              def upload(url, field, name, mime):
                  b = uuid.uuid4().hex
                  body = (f"--{b}\r\nContent-Disposition: form-data; name=\"{field}\"; filename=\"{name}\"\r\nContent-Type: {mime}\r\n\r\n").encode() + img + f"\r\n--{b}--\r\n".encode()
                  req = urllib.request.Request(url, data=body, headers={"Content-Type": f"multipart/form-data; boundary={b}"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              for peer in (None, 0, 2000000001):
                  try:
                      args = {} if peer is None else {"peer_id": peer}
                      srv = call("photos.getMessagesUploadServer", **args)
                      print("upload server peer", peer, ":", json.dumps(srv, ensure_ascii=False)[:160])
                      if "response" in srv:
                          res = upload(srv["response"]["upload_url"], "photo", "og.png", "image/png")
                          print("  upload ответ:", {k: (str(v)[:60]) for k, v in res.items()})
                          if res.get("photo") and res["photo"] != "[]":
                              print("  save:", json.dumps(call("photos.saveMessagesPhoto", photo=res["photo"], server=res["server"], hash=res["hash"]), ensure_ascii=False)[:300])
                  except Exception as e:
                      print("  ошибка:", e)
          EOF
      - uses: actions/checkout@v4
      - name: Bot-style upload test (no post)
        if: ${{ inputs.diagnostics == '1' && inputs.photo_test != '1' && inputs.verify_post_id == '' && inputs.post_now != '1' }}
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          DELETE_POST: ${{ inputs.delete_post }}
        run: |
          pip install -q requests pillow pandas
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from betbot import postimg, vk
          print("VK_TOKEN задан:", bool(os.environ.get("VK_TOKEN")), "| VK_USER_TOKEN задан:", bool(os.environ.get("VK_USER_TOKEN")))
          posts = json.load(open("data/channel.json", encoding="utf-8"))["posts"]
          pid = max(int(k) for k in posts)
          img = postimg.image_for(posts[str(pid)], "новость", posts)
          print("картинка:", pid, len(img or b""))
          d = os.environ.get("DELETE_POST", "").strip()
          if d:
              w = vk._call("wall.getById", posts=f"-{vk.GROUP_ID}_{d}")
              items = w.get("items", w) if isinstance(w, dict) else w
              print("УДАЛЯЮ:", d, [(i.get("text") or "")[:40] for i in items])
              print("wall.delete:", vk._call("wall.delete", owner_id=-vk.GROUP_ID, post_id=int(d)))
              sys.exit(0)
          from urllib.parse import urlparse
          import requests
          import os as _os
          tok = _os.environ.get("VK_USER_TOKEN")
          if tok:
              srv = vk._call("photos.getWallUploadServer", _tok=tok, group_id=vk.GROUP_ID)
              up = srv["upload_url"]; u = urlparse(up)
              print("СЕРВЕР СТЕНЫ:", u.scheme, u.netloc, u.path, "| параметры:", sorted(k.split("=")[0] for k in u.query.split("&")))
              for field, name, mime in (("photo", "post.jpg", "image/jpeg"), ("file", "post.jpg", "image/jpeg"), ("file1", "post.jpg", "image/jpeg")):
                  r = requests.post(up, files={field: (name, img, mime)}, timeout=60)
                  print("ЗАГРУЗКА", field, r.status_code, repr(r.text[:120]))
          try:
              print("ПРАВО VIDEO:", vk._call("video.get", owner_id=-vk.GROUP_ID, count=1).get("count"), "видео у группы")
          except Exception as e:
              print("ПРАВО VIDEO: нет —", e)
          vk._photo.err = ""
          print("ВЛОЖЕНИЕ:", vk._photo(img), "| ошибка:", vk._photo.err)
          for w in vk._call("wall.get", owner_id=-vk.GROUP_ID, count=3)["items"]:
              print("ПОСТ", w["id"], (w.get("text") or "")[:40].replace(chr(10), " "), "| вложения:", [a["type"] for a in w.get("attachments", [])])
          PY

      - name: Test wall.post
        if: ${{ inputs.test_text != '' }}
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          TEST_TEXT: ${{ inputs.test_text }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request
          tok = os.environ["VK_TOKEN"].strip()
          text = os.environ["TEST_TEXT"]
          p = {"owner_id": -228963529, "from_group": 1, "message": text, "access_token": tok, "v": "5.199"}
          data = urllib.parse.urlencode(p).encode()
          try:
              with urllib.request.urlopen("https://api.vk.com/method/wall.post", data, timeout=30) as r:
                  print("wall.post:", json.dumps(json.load(r), ensure_ascii=False)[:500])
          except Exception as e:
              print("wall.post ОШИБКА:", repr(e))
          EOF

      - name: Post now
        if: ${{ always() && inputs.post_now == '1' }}
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
        run: |
          pip install -q requests pillow pandas
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from betbot import vk
          st = json.load(open("data/state.json", encoding="utf-8"))
          posts = json.load(open("data/channel.json", encoding="utf-8"))["posts"]
          newest = max(int(k) for k in posts)
          st["vk_pause_ts"] = 0
          st["vk_floods"] = 0
          st["vk_last"] = max(0, newest - 2)
          n = vk.crosspost(st)
          print("ОПУБЛИКОВАНО:", n, "| mode:", st.get("vk_mode"), "| last:", st.get("vk_last"),
                "| err:", st.get("vk_err"), "| photos:", len(st.get("vk_photos") or []))
          try:
              import os
              w = vk._call("wall.get", _tok=os.environ.get("VK_USER_TOKEN"), owner_id=-vk.GROUP_ID, count=3)
              for it in w.get("items", []):
                  print("ПОСТ", it["id"], "| вложения:", [a["type"] for a in it.get("attachments", [])],
                        "|", (it.get("text") or "")[:40].replace("\n", " "))
          except Exception as e:
              print("wall.get не удался:", e)
          PY

      - name: Test photo post
        if: ${{ always() && inputs.photo_test == '1' }}
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
        run: |
          pip install -q requests pillow pandas
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, ".")
          from betbot import postimg, vk

          posts = json.load(open("data/channel.json", encoding="utf-8"))["posts"]
          pid = max(int(k) for k in posts)
          post = posts[str(pid)]
          image = postimg.image_for(post, "новость", posts)
          if not image:
              raise SystemExit("Не удалось создать тестовое изображение")
          photo = vk._photo(image)
          source = "новая загрузка"
          if not photo:
              raise SystemExit(f"Тест не опубликован: VK не загрузил его картинку: {vk._photo.err}")
          message = f"🧪 Тест фото ВК · {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')}\nПроверка отображения вложения."
          created = vk._call("wall.post", _tok=os.environ.get("VK_TOKEN"), owner_id=-vk.GROUP_ID,
                             from_group=1, message=message, attachments=photo)
          post_id = int(created["post_id"])
          print("TEST_POST_ID:", post_id, "| PHOTO_SOURCE:", source)
          try:
              pending = {"post_id": post_id}
              has_photo = vk._pending_has_photo(pending)
          except Exception as error:
              print(f"TEST_POST_URL: https://vk.com/wall-{vk.GROUP_ID}_{post_id}")
              raise SystemExit(f"Пост создан, но VK временно не дал проверить фото: {error}") from None
          if not has_photo:
              try:
                  vk._call("wall.delete", _tok=os.environ.get("VK_USER_TOKEN"),
                           owner_id=-vk.GROUP_ID, post_id=post_id)
              except Exception as error:
                  raise SystemExit(f"VK создал тест без фото и не дал удалить запись {post_id}: {error}") from None
              raise SystemExit("VK принял тестовый пост без фото; запись удалена")
          print("TEST_POST_URL:", f"https://vk.com/wall-{vk.GROUP_ID}_{post_id}")
          print("TEST_PHOTO_VERIFIED: true")
          PY

      - name: Verify existing VK post photo
        if: ${{ inputs.verify_post_id != '' }}
        env:
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VERIFY_POST_ID: ${{ inputs.verify_post_id }}
        run: |
          pip install -q requests
          python3 - <<'PY'
          import os, re, sys
          sys.path.insert(0, ".")
          from betbot import vk

          post_id = os.environ.get("VERIFY_POST_ID", "").strip()
          token = os.environ.get("VK_USER_TOKEN", "").strip()
          if not re.fullmatch(r"\d+", post_id):
              raise SystemExit("Номер записи должен содержать только цифры")
          if not token:
              raise SystemExit("В GitHub Actions не задан секрет VK_USER_TOKEN")
          result = vk._call("wall.getById", _tok=token, posts=f"-{vk.GROUP_ID}_{post_id}")
          items = result.get("items", []) if isinstance(result, dict) else result if isinstance(result, list) else []
          if not items:
              raise SystemExit(f"VK не вернул запись {post_id}")
          post = items[0]
          attachments = post.get("attachments", [])
          photos = [item["photo"] for item in attachments if item.get("type") == "photo" and isinstance(item.get("photo"), dict)]
          print("POST_URL:", f"https://vk.com/wall-{vk.GROUP_ID}_{post_id}")
          print("ATTACHMENT_TYPES:", [item.get("type") for item in attachments])
          print("PHOTO_COUNT:", len(photos))
          for photo in photos:
              print("PHOTO_ID:", f"{photo.get('owner_id')}_{photo.get('id')}", "| sizes:", len(photo.get("sizes", [])))
          if not photos:
              raise SystemExit("В записи ВК нет фото-вложения")
          print("TEST_PHOTO_VERIFIED: true")
          PY
