name: VK check
# Ручная проверка ключа ВКонтакте: какое сообщество, какие права. Сам ключ в журнал не попадает.
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check VK token
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.parse, urllib.request
          tok = os.environ.get("VK_TOKEN", "").strip()
          print("ключ задан:", bool(tok))
          def call(method, **p):
              p.update(access_token=tok, v="5.199")
              data = urllib.parse.urlencode(p).encode()
              with urllib.request.urlopen(f"https://api.vk.com/method/{method}", data, timeout=30) as r:
                  return json.load(r)
          g = call("groups.getById")
          print("groups.getById:", json.dumps(g, ensure_ascii=False)[:600])
          gid = None
          try:
              items = g["response"].get("groups") or g["response"]
              gid = items[0]["id"]
              print("СООБЩЕСТВО:", items[0].get("name"), "| vk.com/" + str(items[0].get("screen_name")), "| id", gid)
          except Exception as e:
              print("не удалось определить сообщество:", e)
          if gid:
              print("photos.getWallUploadServer:", json.dumps(call("photos.getWallUploadServer", group_id=gid), ensure_ascii=False)[:300])
              print("wall.get:", json.dumps(call("wall.get", owner_id=-gid, count=1), ensure_ascii=False)[:300])
              # пустой пост: ВК его не опубликует, но по ошибке видно, есть ли право публиковать (27 — нет, 100 — есть)
              print("wall.post (пустой, проверка прав):", json.dumps(call("wall.post", owner_id=-gid, from_group=1, message=""), ensure_ascii=False)[:300])
              # тест загрузки фото (ничего не публикуется): берём картинку и пробуем разные варианты
              import uuid
              img = urllib.request.urlopen("https://horoooos.github.io/betbot/og.png", timeout=30).read()
              def upload(url, field, name, mime):
                  b = uuid.uuid4().hex
                  body = (f"--{b}\r\nContent-Disposition: form-data; name=\"{field}\"; filename=\"{name}\"\r\nContent-Type: {mime}\r\n\r\n").encode() + img + f"\r\n--{b}--\r\n".encode()
                  req = urllib.request.Request(url, data=body, headers={"Content-Type": f"multipart/form-data; boundary={b}"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              for peer in (None, 0, 2000000001):
                  try:
                      args = {} if peer is None else {"peer_id": peer}
                      srv = call("photos.getMessagesUploadServer", **args)
                      print("upload server peer", peer, ":", json.dumps(srv, ensure_ascii=False)[:160])
                      if "response" in srv:
                          res = upload(srv["response"]["upload_url"], "photo", "og.png", "image/png")
                          print("  upload ответ:", {k: (str(v)[:60]) for k, v in res.items()})
                          if res.get("photo") and res["photo"] != "[]":
                              print("  save:", json.dumps(call("photos.saveMessagesPhoto", photo=res["photo"], server=res["server"], hash=res["hash"]), ensure_ascii=False)[:300])
                  except Exception as e:
                      print("  ошибка:", e)
          EOF
      - uses: actions/checkout@v4
      - name: Bot-style upload test (no post)
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
        run: |
          pip install -q requests pillow pandas
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from betbot import postimg, vk
          print("VK_TOKEN задан:", bool(os.environ.get("VK_TOKEN")), "| VK_USER_TOKEN задан:", bool(os.environ.get("VK_USER_TOKEN")))
          posts = json.load(open("data/channel.json", encoding="utf-8"))["posts"]
          pid = max(int(k) for k in posts)
          img = postimg.image_for(posts[str(pid)], "новость", posts)
          print("картинка:", pid, len(img or b""))
          vk._photo.err = ""
          print("ВЛОЖЕНИЕ:", vk._photo(img), "| ошибка:", vk._photo.err)
          for w in vk._call("wall.get", owner_id=-vk.GROUP_ID, count=3)["items"]:
              print("ПОСТ", w["id"], (w.get("text") or "")[:40].replace(chr(10), " "), "| вложения:", [a["type"] for a in w.get("attachments", [])])
          PY
