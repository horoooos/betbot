name: Project audit and express regressions
on:
  push:
    branches: [codex/project-audit-20261127]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Read production state and validate publication sources
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
        run: python tools/project_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-audit
          path: work/project-audit
