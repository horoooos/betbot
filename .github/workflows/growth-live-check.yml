name: Verify published discovery pages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts && npx playwright install --with-deps chrome
        working-directory: tools/browser-qa
      - run: node tools/browser-qa/growth-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-growth-proof
          path: work/growth-live
