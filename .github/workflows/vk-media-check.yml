name: VK media check
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "access — права ключа; wall — новая картинка стены; album — новая картинка альбома"
        type: choice
        options: [access, app-info, album-access, link-preview, link-parsed-preview, link-community-preview, story-test, story-to-wall, story-to-wall-user, gif-wall, gif-message-wall, docs-info, graffiti-wall, existing-photo, keyed-photo, event-photo, fresh-wall, fresh-personal-wall, fresh-chat-photo, wall, album]
        default: access
      story_id:
        description: "ID опубликованной истории для одного тестового поста"
        required: false
      recipient:
        description: "Ссылка или ID администратора, разрешившего сообщения группы (только для GIF-теста)"
        required: false
      photo_reference:
        description: "Только публичный ID фото формата photo-123_456 (без URL и ключей доступа)"
        required: false
permissions:
  contents: read
concurrency:
  group: vk-media-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow pandas
      - name: Check access or publish one uploaded image
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_SERVICE_KEY: ${{ secrets.VK_SERVICE_KEY }}
          VK_MEDIA_MODE: ${{ inputs.mode }}
          VK_STORY_TEST_ID: ${{ inputs.story_id }}
          VK_DOC_TEST_RECIPIENT: ${{ inputs.recipient }}
          VK_PUBLIC_PHOTO_REFERENCE: ${{ inputs.photo_reference }}
          VK_TEST_PHOTO_ATTACHMENT: ${{ secrets.VK_TEST_PHOTO_ATTACHMENT }}
        run: python tools/vk_media_check.py
