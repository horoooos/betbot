name: Refresh VK RSS
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: vk-rss-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow pandas
      - name: Format fresh RSS entries and save short links
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_WALL_REQUIRE_FRESH: '1'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from betbot import pages
          store = {int(k): v for k, v in json.loads(Path('data/channel.json').read_text(encoding='utf-8'))['posts'].items()}
          Path('docs/rss-vk.xml').write_text(pages._vk_rss(pages._news(store), pd.Timestamp.now(tz='UTC')), encoding='utf-8')
          PY
          git config user.name betbot
          git config user.email betbot@users.noreply.github.com
          git add data/vk_rss_links.json docs/rss-vk.xml docs/rss-images
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh VK RSS short links and formatting'
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - name: Publish refreshed RSS on the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
