<script type="module">
import * as THREE from "three";

// ═════════════════════════ параметры ═════════════════════════
const q = new URLSearchParams(location.search);
const SPORT = q.get("s") || "football";
const PATH = q.get("p") || `soccer/${q.get("l") || "eng.1"}`;      // старые ссылки: l=eng.1
const EVENT = q.get("e"), RU_H = q.get("h"), RU_A = q.get("a");
const $ = id => document.getElementById(id);

const FIELD = { football: [105, 68], hockey: [61, 26], basketball: [28.6, 15.2], tennis: [23.8, 11] }[SPORT] || [105, 68];
const [L, Wd] = FIELD;
const SC = L / 105;

// ═════════════════════════ сцена ═════════════════════════
const renderer = new THREE.WebGLRenderer({ canvas: $("scene"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

const camera = new THREE.PerspectiveCamera(42, 1, 1, 900);
const world = new THREE.Group(); scene.add(world);
const MAXANI = renderer.capabilities.getMaxAnisotropy();
function tex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; return t; }
function surface(draw, w = 2048) { const c = document.createElement("canvas"); c.width = w; c.height = Math.round(w * Wd / L);
  const g = c.getContext("2d"), k = c.width / L; draw(g, k, c); return tex(c); }
const line = (g, k, w = .12) => { g.strokeStyle = "rgba(255,255,255,.95)"; g.lineWidth = Math.max(3, w * k); };

const DRAW = {
  football(g, k, c) {
    for (let i = 0; i < 12; i++) { g.fillStyle = i % 2 ? "#2f8f3b" : "#33983f"; g.fillRect(i * c.width / 12, 0, c.width / 12 + 1, c.height); }
    line(g, k, .16); const Rc = (x, y, w, h) => g.strokeRect(x * k, y * k, w * k, h * k);
    Rc(.5, .5, L - 1, Wd - 1);
    g.beginPath(); g.moveTo(L / 2 * k, .5 * k); g.lineTo(L / 2 * k, (Wd - .5) * k); g.stroke();
    g.beginPath(); g.arc(L / 2 * k, Wd / 2 * k, 9.15 * k, 0, 7); g.stroke();

    for (const s of [0, 1]) {
      const x = s ? L - .5 : .5, d = s ? -1 : 1;
      Rc(s ? L - 17 : .5, Wd / 2 - 20.16, 16.5, 40.32); Rc(s ? L - 6 : .5, Wd / 2 - 9.16, 5.5, 18.32);
      g.beginPath(); g.arc((x + d * 11) * k, Wd / 2 * k, 9.15 * k, s ? Math.PI * .705 : -Math.PI * .295, s ? Math.PI * 1.295 : Math.PI * .295); g.stroke();
    }
  },
  hockey(g, k, c) {
    g.fillStyle = "#eef4fb"; g.fillRect(0, 0, c.width, c.height);
    const X = v => (v + L / 2) * k, Y = v => (v + Wd / 2) * k;
    g.fillStyle = "#c8202f"; g.fillRect(X(-.15), 0, .3 * k, c.height);
    g.fillStyle = "#1f4fb8"; for (const x of [-7.6, 7.6]) g.fillRect(X(x) - .15 * k, 0, .3 * k, c.height);
    g.strokeStyle = "#c8202f"; g.lineWidth = .1 * k;
    for (const x of [-26.5, 26.5]) { g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), c.height); g.stroke(); }
    g.strokeStyle = "#1f4fb8"; g.beginPath(); g.arc(X(0), Y(0), 4.5 * k, 0, 7); g.stroke();
    g.strokeStyle = "#c8202f"; for (const [x, y] of [[-20, -6.7], [-20, 6.7], [20, -6.7], [20, 6.7]]) { g.beginPath(); g.arc(X(x), Y(y), 4.5 * k, 0, 7); g.stroke(); }
    g.fillStyle = "#c8202f"; for (const [x, y] of [[-20, -6.7], [-20, 6.7], [20, -6.7], [20, 6.7], [-6.1, -6.7], [-6.1, 6.7], [6.1, -6.7], [6.1, 6.7]]) { g.beginPath(); g.arc(X(x), Y(y), .3 * k, 0, 7); g.fill(); }
    g.fillStyle = "rgba(80,140,230,.55)"; for (const s of [-1, 1]) { g.beginPath(); g.arc(X(s * 26.5), Y(0), 1.8 * k, s < 0 ? -Math.PI / 2 : Math.PI / 2, s < 0 ? Math.PI / 2 : Math.PI * 1.5); g.fill(); }

  const b = botData, esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const tc = (cls, title, t) => t ? `<div class="tc ${cls}"><div><small>${title}</small><b>${esc(t.label)}</b></div><div class="r"><small>шанс</small>${pc(t.p)}<small>кэф ${t.est ? "≈" : ""}${(+t.odds || 0).toFixed(2)}</small></div></div>` : "";
  let html = `<h3>🎯 Прогноз бота <button class="x" id="sx">✕</button></h3>${tc("m", "ОСНОВНОЙ ПРОГНОЗ", b.main)}${tc("b", "СМЕЛЫЙ ПРОГНОЗ", b.bold)}`;
  const bar = b.bar || [];
  if (bar.length === 3 && bar.every(v => v != null)) {
    const cols = [H.color, "#7f8bb3", A.color], names = [H.ru, SPORT === "football" ? "Ничья" : "", A.ru];
    html += `<h4>Шансы на победу</h4><div class="b3">${bar.map((v, i) => v > 0 ? `<div style="width:${v * 100}%;background:${cols[i]}">${pc(v)}</div>` : "").join("")}</div>
      <div class="b3l">${names.map((n, i) => bar[i] > 0 ? `<span>${esc(n)}</span>` : "").join("")}</div>`;
  }
  if (b.center) html += `<p class="disc" style="margin-top:8px">${esc(b.center)}</p>`;
  if (b.markets?.length) html += `<h4>Шансы по рынкам</h4>` + b.markets.map(([l, p, o]) =>
    `<div class="mr"><span>${esc(l)}</span><div class="mb"><i style="width:${p * 100}%;background:${p >= .6 ? "#2ecc71" : p >= .45 ? "#ffc400" : "#ff7a3d"}"></i></div><span class="p">${pc(p)}</span><span class="o">${o ? (+o).toFixed(2) : "—"}</span></div>`).join("");
  if (b.scores?.length) html += `<h4>Самые вероятные счета</h4><div class="chips2">${b.scores.map(([sc, p]) => `<span>${esc(sc)}<small>${pc(p)}</small></span>`).join("")}</div>`;
  if (b.corners || b.cards) html += `<h4>Статистика матча (ожидание)</h4><div class="chips2">${b.corners ? `<span>🚩 Угловые<small>≈${b.corners}</small></span>` : ""}${b.cards ? `<span>🟨 Карточки<small>≈${b.cards}</small></span>` : ""}</div>`;
  html += `<p class="disc">Шанс — оценка модели бота; кэф — средний у букмекеров («≈» — расчётный). Прогноз — не гарантия. 18+</p>`;
  $("sheetIn").innerHTML = html;
}
if (EVENT) loadBot();

// ═════════════════════════ зрители и чат (Firebase) ═════════════════════════
if (EVENT) import("./fb.js?v=6").then(fb => {
  fb.track(`live:${EVENT}`, EVENT);
  fb.watchPresence(all => { const n = all[EVENT] || 0; $("viewers").textContent = `👁 ${n} ${n % 10 === 1 && n % 100 !== 11 ? "смотрит" : "смотрят"}`; $("viewers").style.display = "inline-block"; });
  $("chatbtn").style.display = "inline-block";
  let mounted = false;
  $("chatbtn").onclick = () => { if (!mounted) { fb.mountChat(EVENT, $("chatBox"), n => { $("chatbtn").textContent = `💬 Чат · ${n}`; }); mounted = true; } $("chatSheet").classList.add("on"); };
  $("chatx").onclick = () => $("chatSheet").classList.remove("on");
  $("chatSheet").onclick = e => { if (e.target.id === "chatSheet") $("chatSheet").classList.remove("on"); };
}).catch(e => console.warn("чат недоступен", e));

if (q.has("debug")) Object.assign(window, { __load: () => load(), __handle: p => HANDLE(p), __H: H, __A: A, __cam: camera, __world: world, __q: queue, __figs: figs,
  __state: () => ({ mode, simOn, poss: poss.ru, ball: BALL.mode, owner: BALL.owner?.name || BALL.owner?.num }), __sim: on => { simOn = on; mode = on ? "play" : "idle"; },
  __run: async (sec, fps = 30) => { manual = true; let n = last; for (let i = 0; i < sec * fps; i++) { n += 1000 / fps; frame(n); await Promise.resolve(); await Promise.resolve(); } manual = false; },
  __rt: async sec => { manual = true; const end = performance.now() + sec * 1000; while (performance.now() < end) { frame(performance.now()); await new Promise(r => setTimeout(r, 30)); } manual = false; } });
if (!EVENT) $("msg").textContent = "Матч не найден: откройте трекер по кнопке под постом в канале или в списке матчей.";
else {
  load().catch(e => { console.warn(e); $("msg").textContent = "Не удалось загрузить матч. Проверьте интернет и откройте ещё раз."; });
  setInterval(() => load().catch(() => {}), SPORT === "tennis" ? 20000 : 12000);
}
</script>
</body>
</html>
