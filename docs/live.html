<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>АИ СТАВИТ — матч в прямом эфире</title>
<meta name="description" content="Живой 3D-трекер матча: счёт, события на площадке и статистика в реальном времени.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070b1a; --card:rgba(16,22,46,.8); --line:rgba(255,255,255,.12); --ink:#fff; --muted:#a0acd0;
          --gold:#ffc400; --live:#ff4646; }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { height:100%; background:var(--bg); color:var(--ink); font-family:Montserrat,system-ui,sans-serif; overflow:hidden }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block }
  .hud { position:fixed; left:0; right:0; pointer-events:none; padding:12px 14px; z-index:3 }
  .top { top:0 } .bottom { bottom:0 }
  .bar { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--card);
         border:1px solid var(--line); border-radius:20px; padding:10px 14px; backdrop-filter:blur(10px); max-width:760px; margin:0 auto }
  .team { display:flex; align-items:center; gap:8px; flex:1 1 0; min-width:0 }
  .team.away { justify-content:flex-end; text-align:right }
  .team img { width:34px; height:34px; object-fit:contain; flex:none }
  .team img:not([src]) { display:none }
  .team .nm { font-weight:800; font-size:14px; line-height:1.15; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical }
  .team .stripe { width:4px; height:30px; border-radius:2px; flex:none }
  .mid { text-align:center; flex:none }
  .score { font-weight:900; font-size:30px; letter-spacing:1px; transition:transform .3s, color .3s }
  .score.bump { transform:scale(1.35); color:var(--gold) }
  .sets { font-size:11px; color:var(--muted); font-weight:700; margin-top:1px }
  .sets:empty { display:none }
  .clock { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--muted); margin-top:2px }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--live); box-shadow:0 0 10px var(--live); animation:pulse 1.2s infinite }
  .dot.off { background:var(--muted); box-shadow:none; animation:none }
  @keyframes pulse { 50% { opacity:.35 } }
  .league { text-align:center; font-size:11px; font-weight:700; color:var(--muted); letter-spacing:1.5px; margin-top:6px; text-transform:uppercase }
  #tag { position:fixed; z-index:2; pointer-events:none; transform:translate(-50%,-130%); padding:8px 12px 8px 14px; border-radius:14px;
         background:var(--card); border:1px solid var(--line); backdrop-filter:blur(8px); white-space:nowrap; opacity:0;
         transition:opacity .3s, left .9s cubic-bezier(.3,.7,.2,1), top .9s cubic-bezier(.3,.7,.2,1) }
  #tag .t { font-weight:800; font-size:14px } #tag .e { font-size:12px; color:var(--muted); font-weight:600 }
  #tag::before { content:""; position:absolute; left:0; top:8px; bottom:8px; width:4px; border-radius:2px; background:var(--c,#fff) }
  #flash { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0 }
  #big { position:fixed; left:50%; top:42%; z-index:4; pointer-events:none; transform:translate(-50%,-50%) scale(.2);
         font-weight:900; font-size:min(22vw,150px); letter-spacing:4px; opacity:0; text-align:center; line-height:1; white-space:nowrap;
         text-shadow:0 0 40px var(--bc,#ffc400), 0 0 90px var(--bc,#ffc400), 0 8px 0 rgba(0,0,0,.35) }
  #big small { display:block; font-size:min(5vw,30px); letter-spacing:1px; margin-top:10px; text-shadow:0 2px 8px rgba(0,0,0,.6) }
  #big.on { animation:boom 2.8s cubic-bezier(.2,1.4,.3,1) forwards }
  @keyframes boom { 0% { opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-8deg) }
    12% { opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(3deg) } 22% { transform:translate(-50%,-50%) scale(1) rotate(0) }
    80% { opacity:1; transform:translate(-50%,-50%) scale(1.05) } 100% { opacity:0; transform:translate(-50%,-50%) scale(1.6) } }
  #chip { position:fixed; left:50%; top:30%; z-index:4; pointer-events:none; transform:translate(-50%,-50%); opacity:0; white-space:nowrap;
          padding:12px 22px; border-radius:18px; font-weight:900; font-size:22px; letter-spacing:1px; background:var(--card);
          border:2px solid var(--cc,#fff); box-shadow:0 0 30px var(--cc,#fff) }
  #chip.on { animation:chip 1.9s ease-out forwards }
  @keyframes chip { 0% { opacity:0; transform:translate(-50%,-30%) scale(.7) } 15% { opacity:1; transform:translate(-50%,-50%) scale(1.05) }
    75% { opacity:1 } 100% { opacity:0; transform:translate(-50%,-70%) scale(1) } }
  .panel { max-width:760px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:20px;
           padding:10px 14px; backdrop-filter:blur(10px) }
  #stats { display:grid; grid-template-columns:1fr 1fr; column-gap:18px }
  .stat { display:grid; grid-template-columns:38px 1fr 38px; align-items:center; gap:6px; margin:2px 0; font-size:12px; font-weight:800 }
  .stat .lbl { grid-column:1/4; text-align:center; font-size:10px; color:var(--muted); letter-spacing:1.2px; text-transform:uppercase; margin-bottom:-2px }
  .stat .v { text-align:center } .track { display:flex; height:6px; border-radius:3px; overflow:hidden; background:rgba(255,255,255,.08); gap:3px }
  .track i { display:block; height:100%; border-radius:3px; transition:width .8s } .track i:last-child { margin-left:auto }
  .feed { margin-top:6px; border-top:1px solid var(--line); padding-top:4px; font-size:12px; color:var(--muted); max-height:38px; overflow:hidden }
  #stats:empty + .feed { margin-top:0; border-top:0; padding-top:0 }
  .feed div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.5 } .feed b { color:var(--ink); margin-right:6px }
  .brand { position:fixed; right:14px; top:50%; transform:translateY(-50%) rotate(90deg); transform-origin:right center;
           font-size:11px; color:rgba(255,255,255,.35); font-weight:700; letter-spacing:2px; pointer-events:none; z-index:3 }
  #msg { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; font-weight:700; color:var(--muted); z-index:5 }
  #replay { pointer-events:auto; display:none; margin:8px auto 0; background:var(--gold); color:#1e1606; border:0; border-radius:12px;
            padding:8px 16px; font:800 13px Montserrat,sans-serif }
  @media (max-height:560px) { .panel { padding:6px 10px } .stat .lbl { font-size:9px } .feed { display:none } }
  @media (max-width:520px) { .bar { gap:6px; padding:10px } .team { gap:5px } .team .nm { font-size:11px; letter-spacing:-.2px } .score { font-size:26px }
    .team img { width:24px; height:24px } .team .stripe { display:none } #chip { font-size:18px } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="flash"></div>
<div id="big"></div>
<div id="chip"></div>
<div id="msg">Загружаем матч…</div>
<div class="hud top">
  <div class="bar">
    <div class="team home"><span class="stripe" id="hc"></span><img id="hl" alt=""><span class="nm" id="hn">—</span></div>
    <div class="mid"><div class="score" id="sc">0 : 0</div><div class="sets" id="sets"></div>
      <div class="clock"><span class="dot" id="dot"></span><span id="cl">—</span></div></div>
    <div class="team away"><span class="nm" id="an">—</span><img id="al" alt=""><span class="stripe" id="ac"></span></div>
  </div>
  <div class="league" id="lg"></div>
  <div style="text-align:center"><button id="replay">▶ Смотреть повтор матча</button></div>
</div>
<div id="tag"><div class="t" id="tt"></div><div class="e" id="te"></div></div>
<div class="hud bottom"><div class="panel"><div id="stats"></div><div class="feed" id="feed"></div></div></div>
<div class="brand">@AISTAVVIT</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from "three";

// ── параметры: вид спорта, путь ESPN, id матча, русские названия ─────────────
const q = new URLSearchParams(location.search);
const SPORT = q.get("s") || "football";
const PATH = q.get("p") || `soccer/${q.get("l") || "eng.1"}`;      // старые ссылки: l=eng.1
const EVENT = q.get("e"), RU_H = q.get("h"), RU_A = q.get("a");
const $ = id => document.getElementById(id);
if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); }

// размеры площадок в метрах
const FIELD = { football: [105, 68], hockey: [61, 26], basketball: [28.6, 15.2], tennis: [23.8, 11] }[SPORT] || [105, 68];
const [L, Wd] = FIELD;
const SC = L / 105;                                       // масштаб камеры и эффектов относительно футбола

// ── сцена и рендер ───────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas: $("scene"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b1a);
scene.fog = new THREE.Fog(0x070b1a, 170 * SC, 340 * SC);
const camera = new THREE.PerspectiveCamera(42, 1, 1, 900);
const world = new THREE.Group(); scene.add(world);
const MAXANI = renderer.capabilities.getMaxAnisotropy();

function tex(c) {                                         // текстура без ряби: мипмапы и анизотропная фильтрация
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.generateMipmaps = true; return t;
}
function surface(draw, w = 2048) {
  const c = document.createElement("canvas"); c.width = w; c.height = Math.round(w * Wd / L);
  const g = c.getContext("2d"), k = c.width / L; draw(g, k, c); return tex(c);
}
const line = (g, k, w = .12) => { g.strokeStyle = "rgba(255,255,255,.95)"; g.lineWidth = Math.max(3, w * k); };

// ── площадки ─────────────────────────────────────────────────────────────────
const DRAW = {
  football(g, k, c) {   // мягкие полосы газона (резкие контрастные полосы и давали «рябь» на телефоне)
    for (let i = 0; i < 12; i++) { g.fillStyle = i % 2 ? "#2f8f3b" : "#33983f"; g.fillRect(i * c.width / 12, 0, c.width / 12 + 1, c.height); }
    line(g, k, .16); const Rc = (x, y, w, h) => g.strokeRect(x * k, y * k, w * k, h * k);
    Rc(.5, .5, L - 1, Wd - 1);
    g.beginPath(); g.moveTo(L / 2 * k, .5 * k); g.lineTo(L / 2 * k, (Wd - .5) * k); g.stroke();
    g.beginPath(); g.arc(L / 2 * k, Wd / 2 * k, 9.15 * k, 0, 7); g.stroke();
    for (const s of [0, 1]) {
      const x = s ? L - .5 : .5, d = s ? -1 : 1;
      Rc(s ? L - 17 : .5, Wd / 2 - 20.16, 16.5, 40.32); Rc(s ? L - 6 : .5, Wd / 2 - 9.16, 5.5, 18.32);
      g.beginPath(); g.arc((x + d * 11) * k, Wd / 2 * k, 9.15 * k, s ? Math.PI * .705 : -Math.PI * .295, s ? Math.PI * 1.295 : Math.PI * .295); g.stroke();
    }
  },
  hockey(g, k, c) {
    g.fillStyle = "#eef4fb"; g.fillRect(0, 0, c.width, c.height);
    const X = v => (v + L / 2) * k, Y = v => (v + Wd / 2) * k;
    g.fillStyle = "#c8202f"; g.fillRect(X(-.15), 0, .3 * k, c.height);
    g.fillStyle = "#1f4fb8"; for (const x of [-7.6, 7.6]) g.fillRect(X(x) - .15 * k, 0, .3 * k, c.height);
    g.strokeStyle = "#c8202f"; g.lineWidth = .1 * k;
    for (const x of [-26.5, 26.5]) { g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), c.height); g.stroke(); }
    g.strokeStyle = "#1f4fb8"; g.beginPath(); g.arc(X(0), Y(0), 4.5 * k, 0, 7); g.stroke();
    g.strokeStyle = "#c8202f"; for (const [x, y] of [[-20, -6.7], [-20, 6.7], [20, -6.7], [20, 6.7]]) { g.beginPath(); g.arc(X(x), Y(y), 4.5 * k, 0, 7); g.stroke(); }
    g.fillStyle = "rgba(80,140,230,.55)"; for (const s of [-1, 1]) { g.beginPath(); g.arc(X(s * 26.5), Y(0), 1.8 * k, s < 0 ? -Math.PI / 2 : Math.PI / 2, s < 0 ? Math.PI / 2 : Math.PI * 1.5); g.fill(); }
  },
  basketball(g, k, c) {
    for (let i = 0; i < 24; i++) { g.fillStyle = i % 2 ? "#cc8d4d" : "#d29452"; g.fillRect(0, i * c.height / 24, c.width, c.height / 24 + 1); }
    line(g, k, .06); const X = v => (v + L / 2) * k, Y = v => (v + Wd / 2) * k;
    g.strokeRect(X(-L / 2 + .05), Y(-Wd / 2 + .05), (L - .1) * k, (Wd - .1) * k);
    g.beginPath(); g.moveTo(X(0), 0); g.lineTo(X(0), c.height); g.stroke();
    g.beginPath(); g.arc(X(0), Y(0), 1.8 * k, 0, 7); g.stroke();
    for (const s of [-1, 1]) {
      const bx = s * (L / 2 - 1.575), x0 = s < 0 ? X(-L / 2) : X(L / 2 - 5.8);
      g.fillStyle = "rgba(120,30,30,.55)"; g.fillRect(x0, Y(-2.45), 5.8 * k, 4.9 * k); g.strokeRect(x0, Y(-2.45), 5.8 * k, 4.9 * k);
      g.beginPath(); g.arc(X(bx), Y(0), 6.75 * k, s < 0 ? -Math.PI * .45 : Math.PI * .55, s < 0 ? Math.PI * .45 : Math.PI * 1.45); g.stroke();
    }
  },
  tennis(g, k, c) {
    g.fillStyle = "#2c5fa8"; g.fillRect(0, 0, c.width, c.height);
    line(g, k, .07); const X = v => (v + L / 2) * k, Y = v => (v + Wd / 2) * k;
    g.strokeRect(X(-L / 2 + .05), Y(-5.485), (L - .1) * k, 10.97 * k);
    g.strokeRect(X(-L / 2 + .05), Y(-4.115), (L - .1) * k, 8.23 * k);
    for (const x of [-6.4, 6.4]) { g.beginPath(); g.moveTo(X(x), Y(-4.115)); g.lineTo(X(x), Y(4.115)); g.stroke(); }
    g.beginPath(); g.moveTo(X(-6.4), Y(0)); g.lineTo(X(6.4), Y(0)); g.stroke();
  },
};
const ground = { football: 0x1d5a26, hockey: 0x9fb4c8, basketball: 0x3a2412, tennis: 0x2d6a3e }[SPORT] || 0x1d5a26;
const apron = new THREE.Mesh(new THREE.PlaneGeometry(L * 1.25, Wd * 1.35), new THREE.MeshStandardMaterial({ color: ground, roughness: 1 }));
apron.rotation.x = -Math.PI / 2; apron.position.y = -.25; world.add(apron);
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(L, Wd), new THREE.MeshStandardMaterial({ map: surface(DRAW[SPORT] || DRAW.football), roughness: SPORT === "hockey" ? .3 : .9 }));
pitch.rotation.x = -Math.PI / 2; world.add(pitch);

// подсветка половины атакующей команды
const zoneMat = new THREE.MeshBasicMaterial({ color: 0x2ecc71, transparent: true, opacity: 0, depthWrite: false });
const zone = new THREE.Mesh(new THREE.PlaneGeometry(L / 2, Wd), zoneMat);
zone.rotation.x = -Math.PI / 2; zone.position.y = .08; world.add(zone);

// ворота / кольца / сетка
const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .3, metalness: .2, emissive: 0x000000 });
const red = new THREE.MeshStandardMaterial({ color: 0xd12a2a, roughness: .4, emissive: 0x000000 });
const nets = [], posts = [];
function footballGoal(side) {
  const grp = new THREE.Group();
  for (const z of [-3.66, 3.66]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 2.44), white); p.position.set(0, 1.22, z); grp.add(p); }
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 7.32), white); bar.rotation.x = Math.PI / 2; bar.position.y = 2.44; grp.add(bar);
  const net = new THREE.Mesh(new THREE.BoxGeometry(2, 2.44, 7.32, 4, 4, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: .3 }));
  net.position.set(side, 1.22, 0); grp.add(net); net.userData.side = side; nets.push(net);
  grp.position.x = side * L / 2; world.add(grp);
}
function hockeyGoal(side) {
  const grp = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.TorusGeometry(.9, .05, 8, 24, Math.PI), red); frame.rotation.y = Math.PI / 2; grp.add(frame);
  const net = new THREE.Mesh(new THREE.SphereGeometry(.9, 12, 8, 0, Math.PI, 0, Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: .45 }));
  net.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2; grp.add(net); net.userData.side = side; nets.push(net);
  grp.position.x = side * 26.5; world.add(grp);
}
function hoop(side) {
  const grp = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, 3.05), white); pole.position.set(side * .6, 1.52, 0); grp.add(pole);
  const board = new THREE.Mesh(new THREE.BoxGeometry(.05, 1.05, 1.8), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: .6 }));
  board.position.set(0, 3.4, 0); grp.add(board);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(.23, .02, 8, 24), new THREE.MeshStandardMaterial({ color: 0xff6a00, emissive: 0x552200 }));
  rim.rotation.x = Math.PI / 2; rim.position.set(-side * .38, 3.05, 0); grp.add(rim);
  const net = new THREE.Mesh(new THREE.CylinderGeometry(.23, .15, .45, 12, 3, true), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: .7 }));
  net.position.set(-side * .38, 2.8, 0); grp.add(net); net.userData.side = side; nets.push(net);
  grp.position.x = side * (L / 2 - 1.2); world.add(grp);
}
if (SPORT === "football") { footballGoal(-1); footballGoal(1); posts.push(white); }
if (SPORT === "hockey") {
  hockeyGoal(-1); hockeyGoal(1); posts.push(red);
  const boardMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .4 });
  const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fd0ff, transparent: true, opacity: .15 });
  for (const [w, x, z, ry] of [[L, 0, -Wd / 2, 0], [L, 0, Wd / 2, 0], [Wd, -L / 2, 0, Math.PI / 2], [Wd, L / 2, 0, Math.PI / 2]]) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, 1.1, .2), boardMat); b.position.set(x, .55, z); b.rotation.y = ry; world.add(b);
    const gl = new THREE.Mesh(new THREE.BoxGeometry(w, 1.8, .05), glassMat); gl.position.set(x, 2, z); gl.rotation.y = ry; world.add(gl);
  }
}
if (SPORT === "basketball") { hoop(-1); hoop(1); posts.push(white); }
if (SPORT === "tennis") {
  const net = new THREE.Mesh(new THREE.BoxGeometry(.05, .95, 12.8, 1, 6, 30), new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: .6 }));
  net.position.y = .48; world.add(net); nets.push(net);
  const tape = new THREE.Mesh(new THREE.BoxGeometry(.07, .06, 12.8), white); tape.position.y = .95; world.add(tape);
}

// трибуны со светящейся полосой
const standMat = new THREE.MeshStandardMaterial({ color: 0x141a33, roughness: 1 });
const glowMat = new THREE.MeshBasicMaterial({ color: 0xffc400 });
const gap = 12 * Math.max(SC, .25), sh = 9 * Math.max(SC, .3);
for (const [w, x, z, ry] of [[L * 1.3, 0, -(Wd / 2 + gap), 0], [L * 1.3, 0, Wd / 2 + gap, 0], [Wd * 1.6, -(L / 2 + gap), 0, Math.PI / 2], [Wd * 1.6, L / 2 + gap, 0, Math.PI / 2]]) {
  const s = new THREE.Mesh(new THREE.BoxGeometry(w, sh, gap * .9), standMat); s.position.set(x, sh / 2, z); s.rotation.y = ry; world.add(s);
  const strip = new THREE.Mesh(new THREE.BoxGeometry(w, .25 * SC + .05, .25 * SC + .05), glowMat); strip.position.set(x, sh + .1, z); strip.rotation.y = ry; world.add(strip);
}

// свет без теней: тени от прожектора и давали мерцание («рябь») поля на телефонах
const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x1a2a1a, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(30, 80, 40); scene.add(sun);
for (const [x, z] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(1.4 * SC + .2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xfff4c8 }));
  lamp.position.set(x * L * .6, 45 * SC + 4, z * Wd * .7); scene.add(lamp);
}

// мяч / шайба со свечением, кольцом и шлейфом
const R = ({ football: .55, hockey: .3, basketball: .38, tennis: .2 }[SPORT]) || .55;
const ballGeo = SPORT === "hockey" ? new THREE.CylinderGeometry(R, R, R * .5, 24) : new THREE.SphereGeometry(R, 32, 32);
const ballCol = ({ football: 0xffffff, hockey: 0x111111, basketball: 0xff7a1a, tennis: 0xd9ff3a }[SPORT]) ?? 0xffffff;
const ball = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({ color: ballCol, emissive: ballCol, emissiveIntensity: SPORT === "hockey" ? 0 : .35, roughness: .4 }));
ball.position.set(0, R, 0); world.add(ball);

  $("sc").textContent = `${setsH} : ${setsA}`;
  $("sets").textContent = sh.map((v, i) => `${v}-${sa[i] ?? 0}`).join("  ");
  $("cl").textContent = live ? `Идёт ${n || 1}-й сет` : st.state === "post" ? "Матч завершён" : "Скоро начало"; $("dot").classList.toggle("off", !live);
  $("lg").textContent = tour; $("msg").style.display = "none";
  const gh = sh.reduce((a, b) => a + b, 0), games = gh + sa.reduce((a, b) => a + b, 0);
  if (lastGames !== null && games > lastGames) {           // новый гейм — мяч перелетает сетку
    const hWon = gh > lastGH, who = hWon ? H : A;
    flyTo((hWon ? 1 : -1) * L * .35, (Math.random() - .5) * Wd * .6, 2.5); netShake(0);
    shock(new THREE.Vector3(0, 0, 0), "#d9ff3a", 4); chip(`🎾 ГЕЙМ · ${who.ru}`, "#d9ff3a");
    $("tt").textContent = who.ru; $("te").textContent = `Гейм · ${sh[n - 1] ?? 0}-${sa[n - 1] ?? 0}`; tag.style.opacity = 1; tag.style.setProperty("--c", who.color);
    if (lastSets !== null && setsH + setsA > lastSets) {
      bigText("СЕТ!", `${setsH > lastSetsH ? H.ru : A.ru} · ${setsH}:${setsA}`, "#d9ff3a");
      burst(new THREE.Vector3(0, 1, 0), ["#d9ff3a", "#ffffff", who.color], 200, 1); flash("#d9ff3a", .35); shake = 1;
    }
  }
  lastGames = games; lastGH = gh; lastSets = setsH + setsA; lastSetsH = setsH; first = false;
  $("feed").innerHTML = `<div><b>Сеты</b>${$("sets").textContent || "—"}</div>`;
}
let lastSetsH = 0, lastGH = 0;

async function load() {
  if (SPORT === "tennis") return loadTennis();
  const d = await (await fetch(`https://site.api.espn.com/apis/site/v2/sports/${PATH}/summary?event=${EVENT}`, { cache: "no-store" })).json();
  const comp = d.header.competitions[0];
  const ch = comp.competitors.find(c => c.homeAway === "home"), ca = comp.competitors.find(c => c.homeAway === "away");
  const team = (c, ru, dflt) => ({ id: c.team.id, name: c.team.displayName, ru: ru || c.team.displayName, color: col(c.team.color) || dflt,
    alt: col(c.team.alternateColor), logo: c.team.logos?.[0]?.href || c.team.logo });
  if (first) setTeams(team(ch, RU_H, "#2ecc71"), team(ca, RU_A, "#3498db"));
  $("lg").textContent = d.header.league?.name || "";
  const st = comp.status?.type || {}, live = st.state === "in";
  $("sc").textContent = `${ch.score ?? 0} : ${ca.score ?? 0}`;
  const per = comp.status?.period, unit = SPORT === "football" ? "-й тайм" : SPORT === "hockey" ? "-й период" : "-я четверть";
  $("cl").textContent = live ? (comp.status.displayClock ? `${comp.status.displayClock}${per ? " · " + per + unit : ""}` : (st.shortDetail || "LIVE"))
                          : (st.state === "post" ? "Матч завершён" : (st.shortDetail || "Скоро начало"));
  $("dot").classList.toggle("off", !live);
  if (d.boxscore?.teams?.length === 2) $("stats").innerHTML = statsHTML(d.boxscore.teams);
  const plays = SPORT === "football" ? (d.commentary || []).map(c => c.play ? { ...c.play, text: c.play.text || c.text } : null).filter(Boolean)
                                     : (d.plays || []);
  $("msg").style.display = "none";
  if (st.state === "post" && !replayMode) {
    $("replay").style.display = "inline-block";
    $("replay").onclick = () => { replayMode = true; $("replay").style.display = "none"; queue.length = 0;
      const interesting = plays.filter(p => SPORT === "football" ? !/lineup/i.test(p.text || "")
        : (p.scoringPlay || /penalty|shot|hit|takeaway|steal|block|dunk|turnover/i.test(p.type?.text || "")));
      interesting.forEach(p => queue.push(p)); };
    first = false; return;
  }
  const fresh = plays.filter(p => !seen.has(p.id || p.sequenceNumber));
  fresh.forEach(p => seen.add(p.id || p.sequenceNumber));
  // при открытии показываем только последние события, дальше — всё новое по порядку
  (first ? fresh.slice(-5) : fresh).forEach(p => queue.push(p));
  first = false;
}
if (q.has("debug")) Object.assign(window, { __show: show, __cam: camera, __world: world });
if (!EVENT) $("msg").textContent = "Матч не найден: откройте трекер по кнопке под постом в канале.";
else {
  load().catch(() => { $("msg").textContent = "Не удалось загрузить матч. Проверьте интернет и откройте ещё раз."; });
  setInterval(() => load().catch(() => {}), SPORT === "tennis" ? 20000 : 15000);
}
</script>
