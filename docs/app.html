<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>АИ СТАВИТ — мини-приложение</title>
<link rel="icon" href="favicon.ico" sizes="any">
<script src="https://telegram.org/js/telegram-web-app.js?56"></script>
<style>
  html,body{margin:0;height:100%;background:#070b1a;color:#fff;font:600 15px/1.5 Montserrat,system-ui,sans-serif}
  .w{height:100%;display:grid;place-items:center;text-align:center}
  .logo{font-weight:900;letter-spacing:2px;color:#ffc400;font-size:22px;text-shadow:0 0 24px rgba(255,196,0,.45)}
  .sp{width:38px;height:38px;margin:18px auto 10px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#ffc400;animation:r .8s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}} .m{color:#9aa6cc;font-size:13px}
</style>
</head>
<body>
<div class="w"><div><div class="logo">АИ СТАВИТ</div><div class="sp"></div><div class="m" id="m">Открываем…</div></div></div>
<script>
// Вход мини-приложения Telegram: t.me/<бот>?startapp=<параметр> → нужная страница сайта.
//   m<id матча>  — трансляция матча (3D) с прогнозом бота
//   matches · news · top · feed · preds · home — разделы сайта
(async () => {
  const tg = window.Telegram && Telegram.WebApp;
  try { if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor?.("#070b1a"); tg.setBackgroundColor?.("#070b1a"); } } catch (e) {}
  try { sessionStorage.setItem("tgapp", "1"); } catch (e) {}
  const q = new URLSearchParams(location.search);
  const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || q.get("tgWebAppStartParam") || q.get("startapp") || "";
  const go = u => location.replace(u);
  const PAGES = { matches: "matches.html", news: "news/", top: "top.html", feed: "feed.html", preds: "predictions/", home: "./", teams: "leagues.html" };
  if (PAGES[sp]) return go(PAGES[sp]);
  const m = sp.match(/^m(\d{3,12})$/);
  if (m) {
    const src = location.hostname.endsWith("github.io") ? "https://raw.githubusercontent.com/horoooos/betbot/main/docs/matches.json" : "matches.json";
    try {
      const list = await (await fetch(src, { cache: "no-store" })).json();
      const x = list.find(x => String(x.id) === m[1]);
      if (x && x.url) return go(x.url);
    } catch (e) {}
    document.getElementById("m").textContent = "Матч уже закончился — открываем все матчи…";
    return setTimeout(() => go("matches.html"), 900);
  }
  go("./");
})();
</script>
</body>
</html>
