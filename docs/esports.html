<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Киберспорт: счёт матча — АИ СТАВИТ</title><link rel="icon" href="favicon.ico"><link rel="stylesheet" href="site.css?v=9">
<style>
body{background:#080d20;color:#f2f4ff;font:17px/1.55 system-ui;margin:0;padding:24px}main{max-width:850px;margin:30px auto}a{color:#65bdff}nav{display:flex;gap:24px;margin-bottom:32px}.panel{border:1px solid #343b61;border-radius:24px;padding:32px;background:radial-gradient(ellipse at top,#293658,#141b35 70%);text-align:center}.eyebrow{font-size:14px;letter-spacing:2px;color:#aeb9df;text-transform:uppercase}h1{font-size:clamp(26px,5vw,40px);line-height:1.2;margin:24px 0}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin:36px 0}.team img{width:90px;height:90px;object-fit:contain;display:block;margin:0 auto 16px}.score{font-size:clamp(35px,7vw,64px);font-weight:900;color:#ffc400}.status{display:inline-block;padding:8px 20px;border-radius:30px;background:#283756}.tip{border-top:1px solid #3a4664;margin-top:28px;padding-top:24px}.buttons{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin-top:24px}.buttons a{padding:12px 20px;border-radius:12px;background:#263654;text-decoration:none}.muted{color:#a9b4d4;font-size:14px}@media(max-width:480px){body{padding:14px}.panel{padding:22px 15px}.teams{gap:10px}.team img{width:65px;height:65px}.team{font-size:14px}}
</style></head><body><main><nav><a href="./">АИ СТАВИТ</a><a href="matches.html">Все матчи</a><a href="predictions/">Прогнозы</a></nav>
<section class="panel" id="panel"><div class="eyebrow">Киберспорт</div><h1>Загружаем матч…</h1></section>
<p class="muted">Счёт серии отображается по картам. Страница проверяет обновления каждую минуту.</p></main>
<script>
const q=new URLSearchParams(location.search),id=q.get('e'),div=q.get('d');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){
 let all=null;
 for(const url of location.hostname.endsWith('github.io')?['https://raw.githubusercontent.com/horoooos/betbot/main/docs/matches.json','matches.json']:['matches.json']){
  try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)continue;all=await r.json();break;}catch(e){}
 }
 const m=all?.find(m=>m.sport==='esports'&&String(m.id)===id&&(!div||m.div===div));
 if(!m){document.getElementById('panel').innerHTML='<h1>Матч пока недоступен</h1><p>Проверяем обновления. Прогнозы и результаты доступны в разделе матчей.</p><a href="matches.html">Открыть все матчи →</a>';return;}
 document.title=m.home+' — '+m.away+' · счёт матча — АИ СТАВИТ';
 const status={pre:'Ожидается начало',in:'● Матч идёт',post:'Матч завершён'}[m.state]||'Ожидаем обновления счёта';
 const team=(name,logo)=>'<div class="team">'+(logo?'<img src="'+esc(logo)+'" alt="">':'')+'<strong>'+esc(name)+'</strong></div>';
 const score=m.state==='pre'?'vs':esc(m.hs??'—')+' : '+esc(m.as??'—');
 document.getElementById('panel').innerHTML='<div class="eyebrow">'+esc(m.league)+(m.bo?' · BO'+esc(m.bo):'')+'</div><h1>'+esc(m.home)+' — '+esc(m.away)+'</h1><span class="status">'+status+'</span><div class="teams">'+team(m.home,m.hl)+'<div class="score">'+score+'</div>'+team(m.away,m.al)+'</div><p>'+new Date(m.kickoff).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})+' МСК</p>'+(m.tip?'<div class="tip">🎯 Прогноз бота<br><strong>'+esc(m.tip)+'</strong></div>':'')+'<div class="buttons">'+(m.prediction?'<a href="'+esc(m.prediction)+'">Полный разбор →</a>':'')+'<a href="matches.html">Все матчи</a></div>';
}
load();setInterval(load,60000);
</script></body></html>
